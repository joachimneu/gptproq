[project]
name = "gptproq"
version = "0.3.0"
description = "GPT Pro Queue — a filesystem-as-database prompt job queue for OpenAI background reasoning jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "typer>=0.12",
    "pydantic>=2.7",
    "tomlkit>=0.13",
]

[project.scripts]
gptproq = "gptproq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptproq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = ["ruff>=0.6"]
